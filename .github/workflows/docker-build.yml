name: Build and Publish Docker Image

# This tells GitHub to run this pipeline every time you push to the 'main' branch
on:
  push:
    branches:
      - main

# GitHub Actions need permission to write to your Packages registry
permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log into the GitHub Container Registry using a secure, temporary token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Extract the name of your repository to tag the Docker image properly
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Step 4: Build the Dockerfile and push it to the registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
